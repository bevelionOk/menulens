# Postgres only (spine: local-only operational envelope, AD-1).
# Credentials match DATABASE_URL in .env.example — local dev values, not secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: menu_extraction
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Readiness signal for the first DB consumers (1.2 migrate, 1.8 CI test):
    # plain `up -d` returns before Postgres accepts connections. Use
    # `docker compose up -d --wait` — it blocks until this check reports healthy,
    # which is the safe moment to run `npm run -w server db:migrate`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d menu_extraction"]
      interval: 5s
      start_period: 10s
      retries: 10

volumes:
  postgres-data:
